experiment:
  name: smoke
  results_dir: results
  seeds: [0]
  modes: [hidden, oracle]
  context_features: [gravity]

environment:
  split_seed: 17
  splits:
    train: {low_multiplier: 0.8, high_multiplier: 1.2, count: 3}
    id_test: {low_multiplier: 0.9, high_multiplier: 1.1, count: 2}
    ood_low: {low_multiplier: 0.5, high_multiplier: 0.7, count: 2}
    ood_high: {low_multiplier: 1.3, high_multiplier: 1.5, count: 2}

training:
  total_timesteps: 128
  learning_rate: 0.0003
  n_steps: 64
  batch_size: 64
  n_epochs: 1
  gamma: 0.99
  gae_lambda: 0.95
  device: cpu

evaluation:
  episodes_per_context: 1
  deterministic: true
  seed_offset: 10000

reproducibility:
  deterministic_torch: true
