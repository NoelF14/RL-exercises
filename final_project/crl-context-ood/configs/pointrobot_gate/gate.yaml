# Immutable Dense Semi-Circle PointRobot gate specification.
experiment:
  name: pointrobot_gate
  results_dir: results/pointrobot_gate
  seeds: [0, 1]
  modes: [hidden, oracle]

environment:
  name: DenseSemiCirclePointRobot-v0
  goal_radius: 1.0
  start_position: [0.0, 0.0]
  reset_noise: 0.0
  step_scale: 0.1
  position_limit: 1.5
  horizon: 50
  action_penalty: 0.01
  success_threshold: 0.10
  early_termination: false
  reward_timing: post_transition
  splits:
    train: [-0.6, -0.3, 0.0, 0.3, 0.6]
    id: [-0.45, -0.15, 0.15, 0.45]
    ood_left: [-1.0, -0.8]
    ood_right: [0.8, 1.0]

training:
  total_timesteps: 200000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  device: auto

evaluation:
  episodes_per_context: 10
  deterministic: true
  seed_offset: 20000

reproducibility:
  deterministic_torch: true

gate:
  primary_splits: [train, id]
  ood_role: descriptive_only
  confidence_intervals: false
  specialist_min_own_success_rate: 0.80
  specialist_max_own_mean_final_distance: 0.10
  specialist_nearest_majority_fraction: 0.50
  contextual_min_oracle_success_gain: 0.20
  fixed_center_max_abs_success_gap: 0.10
  probe_history_candidates: [1, 3, 5, 10]
  probe_long_history_candidates: [5, 10]
  probe_min_relative_id_mae_reduction: 0.50
  probe_min_h1_relative_improvement: 0.10

probe:
  seeds: [0, 1]
  trajectories_per_context: 40
  ridge_alpha: 1.0e-3
  action_seed_offset: 70000
  history_lengths: [1, 3, 5, 10]

