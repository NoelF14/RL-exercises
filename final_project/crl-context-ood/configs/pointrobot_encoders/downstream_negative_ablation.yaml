experiment:
  name: pointrobot_encoder_downstream
  results_dir: results/pointrobot_negative_ablation/downstream
  source_gate_config: configs/pointrobot_gate/gate.yaml
methods: [contrastive_alternative]
integration_pilot:
  seeds: [0, 1]
  total_timesteps: 200000
  status: available_after_explicit_encoder_checkpoints
full_primary:
  seeds: [0, 1, 2, 3, 4]
  total_timesteps: 200000
  status: available_after_frozen_full_dataset_encoders
training:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
evaluation:
  splits: [train, id, ood_left, ood_right]
  episodes_per_context: 10
  deterministic: true
  ood_selection_role: descriptive_only
