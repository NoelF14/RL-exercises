contexts:
  train: [-0.6, -0.3, 0.0, 0.3, 0.6]
  id: [-0.45, -0.15, 0.15, 0.45]
  ood_left: [-1.0, -0.8]
  ood_right: [0.8, 1.0]
history:
  length: 5
  transition_fields: [state, action, reward, next_state]
  transition_dimension: 7
  convention: completed_transitions_max_0_t_minus_H_through_t_minus_1
  current_state_outside_latent: true
  empty_history_latent: exact_zero_vector
latent:
  dimension: 8
  inference: deterministic_frozen
diagnostic_trajectories:
  implementation: reuse_pointrobot_encoder_evaluation_semantics
  action_source: first_N_action_sequences_from_immutable_primary_dataset
  behavior_policy: orthogonal_then_isotropic
  trajectories_per_context: 40
  trajectory_seed_offset: 41000
  trajectory_seeds: [41000, 41001, 41002, 41003, 41004, 41005, 41006, 41007, 41008, 41009,
    41010, 41011, 41012, 41013, 41014, 41015, 41016, 41017, 41018, 41019,
    41020, 41021, 41022, 41023, 41024, 41025, 41026, 41027, 41028, 41029,
    41030, 41031, 41032, 41033, 41034, 41035, 41036, 41037, 41038, 41039]
  horizon: 50
  eligible_timesteps: all_decision_times_0_through_49
  action_sequences_shared_across_methods_seeds_and_contexts: true
  ppo_trajectories_forbidden: true
probe:
  predictor: ordinary_least_squares_with_intercept
  target: signed_goal_angle_radians
  fit_split: train
  evaluation_splits: [train, id, ood_left, ood_right]
  metric: circular_absolute_angle_error
  formula: abs(atan2(sin(phi_hat-phi),cos(phi_hat-phi)))
  state_only_features: [current_state_x, current_state_y]
  state_only_history_forbidden: true
  selection_role: diagnostic_only
pca:
  components: 2
  fit_split: train
  standardization: none
  refit_on_evaluation_splits: false
  cross_seed_alignment: forbidden
  main_visualization_seed: 0
analysis:
  independent_replicate: encoder_seed
  expected_replicates_per_method: 5
  contexts_and_samples_are_not_replicates: true
  directional_ood: [ood_left, ood_right]
  ood_distance_groups:
    near: 0.8
    far: 1.0
  inference_tests: forbidden_n_equals_5_descriptive_only
  evaluation_manifest: representation_evaluation_files.sha256
  analysis_manifest: representation_analysis_files.sha256
  final_manifest: representation_final_files.sha256
  primary_seed_results: results/pointrobot_primary/primary_summary_by_seed.csv
  primary_oracle_gap: results/pointrobot_primary/primary_oracle_gap_closure.csv
