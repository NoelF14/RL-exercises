[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crl-context-ood"
version = "0.1.0"
description = "Phase 0 experiments for contextual RL under hidden context"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "carl-bench==1.1.1",
  "stable-baselines3==2.7.0",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
crl-ood-train = "crl_ood.training.train_ppo:main"
crl-ood-evaluate = "crl_ood.evaluation.evaluate:main"
crl-ood-phase0 = "crl_ood.training.train_ppo:phase0_main"
crl-ood-analyze = "crl_ood.analysis.analyze_phase0:main"
crl-ood-diagnostic = "crl_ood.diagnostic.run:main"
crl-ood-diagnostic-analyze = "crl_ood.analysis.analyze_diagnostic:main"
crl-ood-oracle-audit = "crl_ood.audit.evaluate:main"
crl-ood-fixed-center-oracle = "crl_ood.audit.run_fixed_center:main"
crl-ood-oracle-audit-analyze = "crl_ood.analysis.analyze_oracle_audit:main"
crl-ood-goal-pilot = "crl_ood.goal_pilot.run:main"
crl-ood-goal-pilot-analyze = "crl_ood.analysis.analyze_goal_pilot:main"
crl-ood-pointrobot-gate = "crl_ood.pointrobot_gate.run:main"
crl-ood-pointrobot-probe = "crl_ood.pointrobot_gate.probe:main"
crl-ood-pointrobot-analyze = "crl_ood.analysis.analyze_pointrobot_gate:main"
crl-ood-pointrobot-encoders = "crl_ood.pointrobot_encoders.cli:main"
crl-ood-pointrobot-encoder-analyze = "crl_ood.analysis.analyze_pointrobot_encoders:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
