env:
  name: LunarLander-v3
seed: 2
agent:
  lr_actor: 0.0005
  lr_critic: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  epochs: 4
  batch_size: 64
  ent_coef: 0.01
  vf_coef: 0.5
  hidden_size: 128
rnd:
  hidden_size: 128
  n_layers: 2
  update_freq: 4
  reward_weight: 0.1
train:
  total_steps: 20000
  eval_interval: 1000
  eval_episodes: 5
